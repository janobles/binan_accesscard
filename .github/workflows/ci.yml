name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Formatting is deliberately not checked. The repo is unformatted on
      # purpose: php-cs-fixer moves executable tokens, which the documentation
      # branch's token gate forbids, so `composer lint` is the sniffer plus the
      # comment checker only.
      - name: Check docblocks
        run: composer lint:sniff

      - name: Check comment style
        run: composer lint:comments

      # --no-coverage is required, not cosmetic. phpunit.xml.dist configures
      # coverage and sets failOnWarning="true", so on a runner with no coverage
      # driver PHPUnit emits "No code coverage driver available" and exits 1
      # even when every test passed. Disabling collection removes the warning
      # rather than the failOnWarning guard, which still has to catch real
      # warnings.
      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

      # A route that names a missing controller resolves at request time, not at
      # test time, so the suite passes and the page 500s. This is the cheapest
      # check that "one page, one URL" still holds.
      - name: Check every route resolves
        run: php spark routes

      # The smoke test builds its own DOM by hand rather than pulling in jsdom,
      # so this needs no npm install. It covers the data-entry control-number
      # gate, where a mis-wired gate binds a saved draft to the wrong record.
      - name: Run the entry page JS smoke test
        run: node tests/js/entry-page-gate.smoke.mjs
